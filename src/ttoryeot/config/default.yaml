terms:
  # true면 혼용 여부와 무관하게 사전의 비권장 표기(alias) 등장을 TERM104로 플래그.
  # 표기 정책(사전 권위 vs 사용 일관성) 선택이므로 기본 off.
  enforce_canonical: false

reference:
  window: 5
  threshold: 0.2
  # 2026-07-28 튜닝 스윕으로 확정 (docs/research/2026-07-28-ref101-tuning.md):
  # head_match 0.45는 '자명한 1위'(사람에겐 명백한 선행사) 오탐을 줄이면서
  # 시드·픽스처 가드를 전부 통과한다. threshold는 0.15부터 시드 recall이 죽는
  # 절벽이 있어 0.2 유지.
  weights:
    distance: 0.3
    role: 0.15
    head_match: 0.45
    recency: 0.1
  # 지시어 뒤 명사(또는 head)가 아래 목록이면 REF101을 내지 않는다.
  # 근거: 외부 코퍼스 실측(docs/research/2026-07-28-external-corpus-fp.md) —
  # structural은 선행사가 링크·코드블록·문서 자체인 구조 참조,
  # discourse는 선행 명제를 가리키는 담화 지시로, 둘 다 NP 후보 랭킹의 대상이 아니다.
  suppress_heads:
    structural: [글, 문서, 예시, 코드, 데모, 영상, 세션, 링크, 페이지, 포스트, 아티클, 블로그, 가이드]
    discourse: [문제, 경우, 방법, 방식, 원칙, 변화, 내용, 이유, 과정, 점]

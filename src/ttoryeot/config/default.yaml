terms:
  # true면 혼용 여부와 무관하게 사전의 비권장 표기(alias) 등장을 TERM104로 플래그.
  # 표기 정책(사전 권위 vs 사용 일관성) 선택이므로 기본 off.
  enforce_canonical: false
  # true면 사전에 없는 조직 고유 용어 후보(NNP/SL 포함 명사구의 반복)를 TERM103
  # info로 제안 — 사전 성장 루프용. 임계는 아래 두 값.
  # 주의: (1) lint에서 TermAnalyzer는 --terms가 있어야 구성되므로, 빈 사전에서
  # 시작하려면 `terms: []`만 담은 terms.yaml을 넘겨라. (2) 제외는 명사구 전체
  # 텍스트의 정확 일치다 — 'Kafka'를 등록해도 'Kafka 클러스터'는 별도 후보로
  # 제안된다 (v1 의미론, round-4에서 부분 일치 검토).
  suggest_unknown: false
  unknown_min_count: 3
  unknown_min_docs: 2
  # true면 사전에 없는 표기 변이 후보를 TERM105 info로 제안한다 — 자소 편집거리
  # 기반이라 사전 선언 없이도 '오너십/오너쉽', '데이터 세트/데이터세트'를 찾는다.
  # 실측(2026-07-29): 실제 변이쌍 0.00~0.22 vs 서로 다른 용어 0.50~0.83.
  suggest_variants: false
  variant_max_ratio: 0.25
  variant_min_count: 2
  # 음절 하한이 실전 노이즈의 최대 원인을 잡는다 — 2음절 한자어는 자소 1개만 달라도
  # 전혀 다른 단어('가지/가치', '인식/일식'). 표기 변이는 외래어에 몰려 3음절 이상이다.
  variant_min_syllables: 3
  variant_max_distance: 2
  # 소수 표기의 빈도 비율 상한. 표기 변이는 소수 이형태이고, 대등한 빈도로 공존하면
  # 서로 다른 어휘일 가능성이 높다('온라인'/'오프라인', '사이드'/'사이트').
  variant_minority_ratio: 0.1
  variant_minority_max_count: 3

ambiguity:
  # true면 상한을 넘는 명사 나열(어절 연쇄)을 AMB101 info로 플래그.
  # 근거는 독립적인 두 계보가 같은 상한에 수렴한다는 것 — ASD-STE100 Rule 2.1
  # "복합명사 3단어 이하"(단어 간 연결이 불명하면 모호성이 생긴다)와 미 연방
  # plain language 지침 avoid-noun-strings "명사 3개를 넘으면 견딜 수 없다".
  # 한국어는 핵어 후치 + 조사 생략 명사 나열이 관용이라 영어보다 연쇄가 더 길게
  # 자란다. opt-in인 이유: 기술문서 장르 특성상 발화율이 높을 수 있어, 외부
  # 코퍼스 실측 후 통합 단계에서 기본값을 재검토한다.
  noun_chain: false
  # STE 2.1·plain language의 3단어 상한을 어절 단위로 옮긴 값. '이하 허용'이므로
  # 진단은 이 값을 초과할 때만 낸다.
  max_noun_chain_eojeol: 3

reference:
  window: 5
  # 유해 모호성(nocuous ambiguity) 임계 — 1·2위 후보의 점수차가 이 값 미만이면
  # 경고한다. Lappin & Leass(1994)의 salience difference threshold, Yang et al.(2011)의
  # margin 조건, Ezzini et al.(ICSE 2022)의 θ_δ=0.1과 같은 계열의 연산이다.
  threshold: 0.2
  # 절대 확신도 하한(Ezzini et al.의 θ_α 대응). 1위 점수가 이 값 미만이면 후보
  # 집합 자체가 빈약하므로 격차와 무관하게 침묵한다.
  min_top_score: 0.0
  # 2026-07-28 튜닝 스윕으로 확정 (docs/research/2026-07-28-ref101-tuning.md):
  # head_match 0.45는 '자명한 1위'(사람에겐 명백한 선행사) 오탐을 줄이면서
  # 시드·픽스처 가드를 전부 통과한다. threshold는 0.15부터 시드 recall이 죽는
  # 절벽이 있어 0.2 유지.
  weights:
    distance: 0.3
    role: 0.15
    head_match: 0.45
    recency: 0.1
  # 지시어 뒤 명사(또는 head)가 아래 목록이면 REF101을 내지 않는다.
  # 근거: 외부 코퍼스 실측(docs/research/2026-07-28-external-corpus-fp.md) —
  # structural은 선행사가 링크·코드블록·문서 자체인 구조 참조,
  # discourse는 선행 명제를 가리키는 담화 지시로, 둘 다 NP 후보 랭킹의 대상이 아니다.
  suppress_heads:
    structural: [글, 문서, 예시, 예제, 코드, 데모, 영상, 세션, 링크, 페이지, 포스트, 아티클, 블로그, 가이드]
    discourse: [문제, 경우, 방법, 방식, 원칙, 변화, 내용, 이유, 과정, 점]
